<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon-Collector ist umgezogen</title>
  <meta http-equiv="refresh" content="3;url=https://stephanweigelt-ger.github.io/Pokemon-collector/">
  <style>body{font-family:-apple-system,system-ui,sans-serif;background:#2a52b0;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}a{color:#ffd23f}</style>
</head>
<body>
  <div>
    <h1>Pokémon-Collector ist umgezogen</h1>
    <p>Neue Adresse: <a href="https://stephanweigelt-ger.github.io/Pokemon-collector/">stephanweigelt-ger.github.io/Pokemon-collector</a></p>
    <p>Bitte das Symbol auf dem Home-Bildschirm löschen und von der neuen Adresse aus neu anlegen.</p>
  </div>
  <script>
    // Alten Offline-Speicher dieser Adresse entfernen, dann weiterleiten.
    (async () => {
      try {
        const regs = await navigator.serviceWorker?.getRegistrations() || [];
        await Promise.all(regs.filter((r) => r.scope.includes('/pokemon/')).map((r) => r.unregister()));
        const keys = await caches.keys();
        await Promise.all(keys.filter((k) => k.startsWith('pokemon-')).map((k) => caches.delete(k)));
      } catch (e) { /* egal */ }
      setTimeout(() => location.replace('https://stephanweigelt-ger.github.io/Pokemon-collector/' + location.hash), 1500);
    })();
  </script>
</body>
</html>
