name: Probe TCGCSV (temporär)
on:
  push:
    branches: [claude/project-thread-9xbfs7]
    paths: ['.github/workflows/probe-tcgcsv.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="collector-catalog/1.0"
          curl -sS -A "$UA" https://tcgcsv.com/tcgplayer/3/groups -o g.json; head -c 600 g.json; echo
          python3 - <<'PY'
          import json,urllib.request,time
          g=json.load(open('g.json'))['results']
          print(len(g),'groups')
          for x in g:
              if any(k in x['name'] for k in ['151','Surging Sparks','Prismatic','Darkness Ablaze']): print(x['groupId'],x['name'],x.get('abbreviation'),x.get('publishedOn'))
          for x in g:
              if x['name'] in ('SV: Scarlet & Violet 151','SV: Surging Sparks','SWSH03: Darkness Ablaze'):
                  r=urllib.request.urlopen(urllib.request.Request(f"https://tcgcsv.com/tcgplayer/3/{x['groupId']}/products",headers={'User-Agent':'collector-catalog/1.0'}))
                  P=json.load(r)['results']
                  sealed=[p for p in P if not any(e.get('name') in ('Number','Rarity') for e in p.get('extendedData',[]))]
                  print('==',x['name'],len(P),'sealed',len(sealed))
                  for p in sealed[:40]: print('  ',p['productId'],p['name'],p['imageUrl'])
                  time.sleep(0.2)
          PY
