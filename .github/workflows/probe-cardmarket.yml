name: Probe Cardmarket (temporär)
on:
  push:
    branches: [claude/project-thread-9xbfs7]
    paths: ['.github/workflows/probe-cardmarket.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://downloads.s3.cardmarket.com/productCatalog
          for f in priceGuide/price_guide_6.json productList/products_nonsingles_6.json productList/products_singles_6.json; do
            echo "== $f"; curl -sS -o x.json -w "%{http_code} %{size_download}\n" $B/$f || true
            head -c 1500 x.json; echo
            python3 - <<'PY' || true
          import json
          d=json.load(open('x.json'))
          print(type(d), list(d.keys())[:10] if isinstance(d,dict) else len(d))
          for k,v in (d.items() if isinstance(d,dict) else []):
              if isinstance(v,list):
                  print(k, len(v)); print(json.dumps(v[:3], ensure_ascii=False)[:1500])
          PY
          done
          echo "== Suche ETB 151 in nonsingles"
          curl -sS -o n.json $B/productList/products_nonsingles_6.json
          python3 -c "
          import json;d=json.load(open('n.json'))
          L=[v for k,v in d.items() if isinstance(v,list)][0]
          hits=[p for p in L if '151' in json.dumps(p)][:15]
          print(json.dumps(hits,ensure_ascii=False,indent=0)[:4000])
          import collections;print(collections.Counter(p.get('categoryName') for p in L).most_common(30))
          "
