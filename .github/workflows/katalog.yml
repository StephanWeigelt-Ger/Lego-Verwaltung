name: Set-Katalog aktualisieren

# Lädt wöchentlich die freie Rebrickable-Setdatenbank und speichert sie als data/katalog.json.
# Die App findet damit Name, Erscheinungsjahr, Thema und Teileanzahl ohne API-Schlüssel.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_catalog.py'
      - '.github/workflows/katalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebrickable-Daten herunterladen
        run: |
          curl -fsSL -o sets.csv.gz https://cdn.rebrickable.com/media/downloads/sets.csv.gz
          curl -fsSL -o themes.csv.gz https://cdn.rebrickable.com/media/downloads/themes.csv.gz
          gunzip -f sets.csv.gz themes.csv.gz
      - name: Katalog bauen
        run: python3 tools/build_catalog.py sets.csv themes.csv data/katalog.json
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/katalog.json
          git diff --cached --quiet || (git commit -m "Set-Katalog aktualisiert" && git push)
